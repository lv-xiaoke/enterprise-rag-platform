name: Full-stack checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag_ci
          POSTGRES_USER: rag_ci
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_ci -d rag_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: rag_ci
      POSTGRES_USER: rag_ci
      POSTGRES_PASSWORD: ci-only-not-a-production-secret
      AUTH_COOKIE_SECURE: "false"
      APP_ORIGIN: http://localhost:5173
      RAG_E2E_TESTING: "1"
      E2E_DATABASE_URL: postgresql+psycopg://rag_ci:ci-only-not-a-production-secret@127.0.0.1:5432/rag_ci
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Migrate clean PostgreSQL
        run: python -m alembic upgrade head
      - name: Backend regression suite
        run: python -m pytest -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests and production build
        working-directory: frontend
        run: npm test && npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser integration tests
        working-directory: frontend
        run: npx playwright test
      - name: Compose configuration
        env:
          LLM_API_KEY: ""
        run: docker compose --env-file .env.example config --quiet
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: frontend/test-results/
          retention-days: 7
